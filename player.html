<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresh Music Player</title>
<style>
:root{
  --bg1:#fbf8f4; --bg2:#f3eefb; --ink:#2b2840; --muted:#8a86a3; --card:rgba(255,255,255,.72);
  --line:rgba(43,40,64,.08); --a1:#ff8fab; --a2:#a78bfa; --a3:#60c5fa; --a4:#fcd38d;
  --grad:linear-gradient(120deg,var(--a1),var(--a2) 50%,var(--a3));
  --shadow:0 1px 2px rgba(43,40,64,.04),0 8px 30px rgba(80,60,140,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:radial-gradient(1200px 700px at 10% -10%,var(--bg2),transparent 60%),
  radial-gradient(900px 600px at 110% 110%,color-mix(in srgb,var(--a3) 14%,transparent),transparent 60%),var(--bg1);
  -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .6s}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 22px 20px;max-width:1500px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:18px;margin-right:auto}
.logo{width:30px;height:30px;border-radius:9px;background:var(--grad);box-shadow:0 4px 14px color-mix(in srgb,var(--a2) 40%,transparent);display:grid;place-items:center}
.logo i{display:flex;gap:2px;align-items:flex-end;height:14px}
.logo b{width:3px;background:#fff;border-radius:2px;animation:eq 1s ease-in-out infinite}
.logo b:nth-child(2){animation-delay:-.3s}.logo b:nth-child(3){animation-delay:-.6s}.logo b:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
.pills{display:flex;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);
  border-radius:999px;padding:4px;box-shadow:var(--shadow);position:relative;flex-wrap:wrap}
.pill{position:relative;z-index:1;border:0;background:none;font:inherit;font-size:13px;font-weight:550;color:var(--muted);
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:color .2s;white-space:nowrap}
.pill kbd{font:inherit;font-size:10px;opacity:.55;margin-right:5px}
.pill:hover{color:var(--ink)}
.pill.on{color:#fff}
.pill.on::before{content:"";position:absolute;inset:0;border-radius:999px;background:var(--grad);z-index:-1;box-shadow:0 4px 12px color-mix(in srgb,var(--a2) 35%,transparent)}
.palettes{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 10px;box-shadow:var(--shadow)}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .2s}
.sw:hover{transform:scale(1.12)}.sw.on{box-shadow:0 0 0 2px var(--ink)}
.stage{position:relative;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-height:0;display:grid;grid-template-columns:1fr auto}
.canvas-wrap{position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .6s}
.drop{position:absolute;inset:18px;border:2px dashed color-mix(in srgb,var(--a2) 45%,transparent);border-radius:20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;transition:all .25s;background:rgba(255,255,255,.35)}
.drop.hidden{opacity:0;pointer-events:none;transform:scale(.98)}
.drop .ico{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--a2) 35%,transparent);animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.drop h2{font-size:22px;letter-spacing:-.02em}
.drop p{color:var(--muted);font-size:14px}
.btn{border:0;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:999px;padding:11px 20px;color:#fff;background:var(--grad);box-shadow:0 6px 18px color-mix(in srgb,var(--a2) 35%,transparent);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow)}
body.dragging .drop{opacity:1;pointer-events:auto;transform:scale(1);border-color:var(--a2);background:rgba(255,255,255,.75)}
.playlist{width:260px;border-left:1px solid var(--line);padding:16px 10px;overflow:auto;display:none;background:rgba(255,255,255,.4)}
.has-tracks .playlist{display:block}
.playlist h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:0 10px 10px;display:flex;justify-content:space-between;align-items:center}
.playlist h3 button{border:0;background:none;color:var(--a2);font:inherit;font-weight:700;cursor:pointer;letter-spacing:.08em}
.trk{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;font-size:13px;color:var(--ink)}
.trk:hover{background:rgba(255,255,255,.8)}
.trk.on{background:#fff;box-shadow:var(--shadow)}
.trk .n{width:18px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;text-align:right}
.trk.on .n{color:var(--a2)}
.trk .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .rm{flex:none;width:22px;height:22px;margin:0;padding:0;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:18px;line-height:1;opacity:0;display:flex;align-items:center;justify-content:center}
.trk:hover .rm,.trk.on .rm,.trk .rm:focus{opacity:1}
.trk .rm:hover{background:rgba(43,40,64,.08);color:var(--ink)}
body.compact .trk .rm{opacity:.65}
.bar{display:grid;grid-template-columns:minmax(160px,1fr) auto minmax(160px,1fr);align-items:center;gap:20px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:22px;padding:14px 20px;box-shadow:var(--shadow)}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.art{width:44px;height:44px;border-radius:13px;background:var(--grad);flex:none;position:relative;overflow:hidden}
.art::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.85)}
.playing .art{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{min-width:0}
.title{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,48vw)}
.ctrls{display:flex;gap:14px;align-items:center}
.ib{border:0;background:none;cursor:pointer;color:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .15s}
.ib:hover{background:rgba(43,40,64,.06)}
.ib svg{width:20px;height:20px;fill:currentColor}
.play{width:48px;height:48px;background:var(--grad);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--a2) 40%,transparent)}
.play:hover{background:var(--grad);transform:scale(1.06)}
.seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:none;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2) ,var(--a3)) 0/var(--p) 100% no-repeat,rgba(43,40,64,.1)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(43,40,64,.1)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.18)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.vol{width:110px;flex:none}
.rpt{position:relative;color:var(--muted)}
.rpt.on{color:var(--a2);background:color-mix(in srgb,var(--a2) 12%,transparent)}
.rpt .badge{position:absolute;right:-6px;top:-3px;min-width:16px;height:15px;padding:0 4px;border-radius:8px;font-size:9px;font-weight:800;line-height:15px;color:#fff;background:var(--grad);display:none;letter-spacing:.02em}
.rpt.on .badge{display:block}
#fsBtn{color:var(--muted)}#fsBtn:hover{color:var(--ink)}
/* native app: keep content clear of the window drag strip / traffic lights */
body.native .app{padding-top:40px}
/* full-screen visualization */
body.fs .app{padding:0;gap:0;max-width:none;grid-template-rows:1fr}
body.fs .stage{grid-row:1;border-radius:0;border:0;box-shadow:none;background:transparent;grid-template-columns:1fr}
body.fs .playlist,body.fs .hint{display:none!important}
body.fs header,body.fs .bar{position:fixed;z-index:5;opacity:0;pointer-events:none;transition:opacity .45s,transform .45s}
body.fs header{top:16px;left:50%;transform:translate(-50%,-10px);width:auto;justify-content:center}
body.fs header .brand{display:none}
body.fs .bar{left:50%;bottom:22px;transform:translate(-50%,10px);width:min(980px,calc(100% - 40px));background:rgba(255,255,255,.6);box-shadow:0 10px 40px rgba(60,40,120,.12)}
body.fs.awake header{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
body.fs.awake .bar{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
body.fs:not(.awake),body.fs:not(.awake) *{cursor:none!important}
.hint{position:absolute;left:20px;bottom:14px;font-size:11px;color:var(--muted);opacity:.8;pointer-events:none}
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%) translateY(-8px);background:#fff;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:820px){body:not(.compact) .bar{grid-template-columns:1fr;justify-items:center}.center{width:100%}body:not(.compact) .right{justify-content:center}.playlist{display:none!important}.stage{grid-template-columns:1fr}.app{padding:12px}}
/* compact layout: menu-bar panel (~420x560) */
.only-compact{display:none!important}
body.compact .only-compact{display:grid!important}
body.compact .app{padding:12px 12px 12px;gap:10px;grid-template-rows:auto 1fr auto auto;max-width:none}
body.native.compact .app{padding-top:12px}
body.compact header{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
body.compact .brand{grid-column:1;grid-row:1}body.compact .palettes{grid-column:2;grid-row:1}body.compact .expand{grid-column:3;grid-row:1}
body.compact .brand{font-size:14px;gap:8px;margin:0;min-width:0;white-space:nowrap}
body.compact .brand small{display:none}
body.compact .logo{width:24px;height:24px;border-radius:7px}
body.compact .logo i{height:11px}
body.compact .palettes{padding:5px 8px;gap:6px}
body.compact .sw{width:15px;height:15px}
body.compact .expand{width:30px;height:30px;color:var(--muted);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
body.compact .expand:hover{color:var(--ink)}
body.compact .expand svg{width:16px;height:16px}
body.compact .pills{grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:14px;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
body.compact .pills::-webkit-scrollbar{display:none}
body.compact .pill{font-size:12px;padding:6px 11px;flex:none}
/* compact: mode + colors dropdown replaces pills/swatches */
.mdd{position:relative}
body.compact .pills,body.compact .palettes{display:none}
body.compact header{grid-template-columns:minmax(0,1fr) auto auto}
body.compact .mdd{grid-column:2;grid-row:1}
body.compact .brand{overflow:hidden;text-overflow:ellipsis}
.mddBtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .2s}
.mddBtn:hover{background:#fff}
.mddBtn .gi{width:20px;height:20px;border-radius:7px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.mddBtn .gi svg,.mddItem .gi svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mddBtn .chev{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.mdd.open .chev{transform:rotate(180deg)}
.mddMenu{position:absolute;top:calc(100% + 8px);right:-38px;width:236px;z-index:30;padding:6px;border-radius:16px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(43,40,64,.06),0 18px 50px rgba(80,60,140,.22);
  opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .18s cubic-bezier(.2,.9,.3,1.2)}
.mdd.open .mddMenu{opacity:1;transform:none;pointer-events:auto}
.mddSec{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 9px 4px}
.mddItem{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;font:inherit;font-size:13px;font-weight:550;color:var(--ink);
  padding:6px 8px;border-radius:10px;cursor:pointer;text-align:left}
.mddItem:hover,.mddItem:focus-visible{background:color-mix(in srgb,var(--a2) 12%,transparent);outline:none}
.mddItem .gi{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--a2);background:color-mix(in srgb,var(--a2) 13%,#fff);flex:none}
.mddItem.on .gi{background:var(--grad);color:#fff}
.mddItem .nm{flex:1}
.mddItem kbd{font:inherit;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.mddItem .ck{width:14px;height:14px;fill:none;stroke:var(--a2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mddItem.on .ck{opacity:1}
.mddSep{height:1px;background:var(--line);margin:5px 6px}
.mddSw{display:flex;gap:8px;padding:4px 9px 8px}
.mddSw button{width:42px;height:26px;border-radius:9px;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.mddSw button.on{box-shadow:0 0 0 2px var(--a2)}
body:not(.compact) .mdd{display:none}
body.compact .stage{border-radius:20px;grid-template-columns:1fr;min-height:150px}
body.compact .hint{display:none}
body.compact .drop{inset:10px;gap:9px;border-radius:16px}
body.compact .drop .ico{width:54px;height:54px;border-radius:17px}
body.compact .drop .ico svg{width:26px;height:26px}
body.compact .drop h2{font-size:17px}
body.compact .drop p{font-size:12px;padding:0 14px}
body.compact .drop .btn{font-size:12px;padding:8px 14px}
body.compact .playlist{display:none!important}
body.compact.has-tracks.pl-open .stage{grid-template-rows:minmax(120px,1fr) auto}
body.compact .canvas-wrap{grid-row:1}
body.compact.has-tracks.pl-open #pl{display:block!important;grid-row:2;width:auto;border:0;border-top:1px solid var(--line);max-height:124px;padding:6px;background:rgba(255,255,255,.5)}
body.compact .playlist h3{display:none}
body.compact .trk{padding:6px 9px;font-size:12px}
body.compact .bar{grid-template-columns:1fr auto;grid-template-areas:"now right" "center center";gap:8px 10px;padding:12px 14px;border-radius:18px;justify-items:stretch}
body.compact .now{grid-area:now}
body.compact .art{width:36px;height:36px;border-radius:11px}
body.compact .title{font-size:13px}
body.compact .sub{font-size:11px}
body.compact .center{grid-area:center;width:100%;gap:4px}
body.compact .right{grid-area:right;gap:2px;justify-content:flex-end}
body.compact .right .ib{width:30px;height:30px}
body.compact .right .ib svg{width:17px;height:17px}
body.compact .vol{width:64px}
body.compact .ctrls{gap:10px}
body.compact .play{width:44px;height:44px}
#plBtn.on{color:var(--a2);background:color-mix(in srgb,var(--a2) 12%,transparent)}
body.compact.fs .stage{min-height:0}


/* ---------- Black theme (T) ---------- */
.themeBtn{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted)}
.themeBtn:hover{color:var(--ink)}
.themeBtn .sun{display:none}
body.dark .themeBtn .moon{display:none}body.dark .themeBtn .sun{display:block}
body.compact .themeBtn{display:none}
.mddTheme{display:flex;gap:6px;padding:2px 9px 8px}
.mddTheme button{flex:1;height:28px;border-radius:9px;border:1px solid var(--line);font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);background:#fff}
.mddTheme button[data-t="black"]{background:#000;color:#f2f0fa}
.mddTheme button.on{box-shadow:0 0 0 2px var(--a2)}
body.dark{--bg1:#000;--bg2:#000;--ink:#f2f0fa;--muted:#8e8aa8;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.45);background:#000;color-scheme:dark}
body.dark .stage{background:#000;border-color:rgba(255,255,255,.08)}
body.dark .drop{background:rgba(0,0,0,.45)}
body.dark.dragging .drop{background:rgba(0,0,0,.8)}
body.dark .btn.ghost{background:#16161c;color:var(--ink)}
body.dark .playlist{background:rgba(255,255,255,.025)}
body.dark .trk:hover{background:rgba(255,255,255,.06)}
body.dark .trk.on{background:rgba(255,255,255,.1);box-shadow:none}
body.dark .trk .rm:hover{background:rgba(255,255,255,.1)}
body.dark .ib:hover{background:rgba(255,255,255,.08)}
body.dark .play:hover{background:var(--grad)}
body.dark .sw{border-color:#111}
body.dark input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--a1),var(--a2) ,var(--a3)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.14)}
body.dark input[type=range]::-moz-range-track{background:rgba(255,255,255,.14)}
body.dark .toast{background:#1b1b22;color:var(--ink)}
body.dark.fs .bar{background:rgba(14,14,18,.72);box-shadow:0 10px 40px rgba(0,0,0,.6)}
body.dark .mddBtn:hover{background:rgba(255,255,255,.1)}
body.dark .mddMenu{background:rgba(22,22,28,.9);border-color:rgba(255,255,255,.08);box-shadow:0 18px 50px rgba(0,0,0,.6)}
body.dark .mddItem .gi{background:color-mix(in srgb,var(--a2) 18%,#000)}
body.dark .mddItem.on .gi{background:var(--grad)}
body.dark .mddItem kbd{background:transparent}
body.dark .mddSw button{border-color:#111}
body.dark.compact.has-tracks.pl-open #pl{background:rgba(255,255,255,.03)}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><div class="logo"><i><b></b><b></b><b></b><b></b></i></div>Fresh Music Player <small>visualizer</small></div>
    <div class="pills" id="modes"></div>
    <div class="palettes" id="palettes" title="Color palette"></div>
    <button class="ib themeBtn" id="themeBtn" title="Black theme (T)"><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1.5 3h-3L12 2zm0 20-1.5-3h3L12 22zM2 12l3-1.5v3L2 12zm20 0-3 1.5v-3L22 12zM4.9 4.9l3.2 1.1-2.1 2.1-1.1-3.2zm14.2 14.2-3.2-1.1 2.1-2.1 1.1 3.2zM4.9 19.1 6 15.9l2.1 2.1-3.2 1.1zM19.1 4.9 18 8.1 15.9 6l3.2-1.1z"/></svg></button>
    <div class="mdd only-compact" id="mdd"><button class="mddBtn" id="mddBtn" aria-haspopup="menu" title="Visualization &amp; colors"><span class="gi" id="mddIco"></span><span id="mddName">Spectrum</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>

(function(){const r=window.requestAnimationFrame.bind(window),c=window.cancelAnimationFrame.bind(window);

  window.setTimeout=(f,ms,...a)=>{const id=st((...x)=>{DBG.to.delete(id);typeof f==='function'?f(...x):0;},ms,...a);DBG.to.add(id);return id;};
  window.clearTimeout=id=>{DBG.to.delete(id);ct(id);};

  EventTarget.prototype.removeEventListener=function(t,f,o){DBG.lis--;return re.call(this,t,f,o);};
  [window.BaseAudioContext,window.AudioContext||window.webkitAudioContext].forEach(B=>{if(!B)return;
    Object.getOwnPropertyNames(B.prototype).filter(n=>/^create/.test(n)&&n!=='createPeriodicWave'&&n!=='createBuffer').forEach(n=>{
      const d=Object.getOwnPropertyDescriptor(B.prototype,n);if(!d||typeof d.value!=='function')return;const o=d.value;
      B.prototype[n]=function(){DBG.nodes++;if(n==='createMediaElementSource')DBG.mes++;return o.apply(this,arguments);};});});})();
(function(){
'use strict';

const params=new URLSearchParams(location.search);

const MODES=[
  {id:'bars',name:'Spectrum'},{id:'wave',name:'Waveform'},{id:'radial',name:'Radial'},
  {id:'particles',name:'Particles'},{id:'ribbons',name:'Ribbons'},{id:'grid',name:'Matrix'}];
const PALETTES=[
  {name:'Blossom',bg1:'#fbf8f4',bg2:'#f6ecfb',c:['#ff8fab','#a78bfa','#60c5fa','#fcd38d']},
  {name:'Mint',bg1:'#f5fbf8',bg2:'#e6f6f1',c:['#34d399','#5eead4','#60a5fa','#bef264']},
  {name:'Sunset',bg1:'#fffaf5',bg2:'#fdeee6',c:['#fb923c','#f472b6','#facc15','#c084fc']},
  {name:'Ocean',bg1:'#f6f9fd',bg2:'#e8effc',c:['#6366f1','#38bdf8','#2dd4bf','#a5b4fc']}];

let mode=Math.max(0,Math.min(5,(parseInt(params.get('mode'))||1)-1));
let pal=Math.max(0,Math.min(3,(parseInt(params.get('palette'))||1)-1));
let tracks=[],cur=-1,demo=false,demoNodes=null,demoPlaying=false;
let actx=null,analyser,gain,srcNode,freq,time,freqF;

/* ---------- UI build ---------- */
const modesEl=$('modes');

const ICONS={bars:'<path d="M5 20V12M10 20V6M15 20V10M20 20V4"/>',wave:'<path d="M2 12c2.5 0 2.5-6 5-6s2.5 12 5 12 2.5-12 5-12 2.5 6 5 6"/>',
  radial:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  particles:'<circle cx="6" cy="7" r="1.6"/><circle cx="16" cy="5" r="1.6"/><circle cx="12" cy="13" r="2.2"/><circle cx="5" cy="18" r="1.6"/><circle cx="19" cy="16" r="1.6"/>',
  ribbons:'<path d="M2 9c4-4 8 4 12 0s6-2 8-1M2 16c4-4 8 4 12 0s6-2 8-1"/>',grid:'<path d="M5 19h.01M10 19h.01M15 19h.01M20 19h.01M10 14h.01M15 14h.01M20 14h.01M15 9h.01M20 9h.01M20 4h.01" stroke-width="3.6"/>'};
const svgI=id=>'<svg viewBox="0 0 24 24">'+ICONS[id]+'</svg>';
const mdd=$('mdd'),mddModes=$('mddModes'),mddSw=$('mddSw');
MODES.forEach((m,i)=>{const b=document.createElement('button');b.className='mddItem';b.setAttribute('role','menuitemradio');
  b.innerHTML='<span class="gi">'+svgI(m.id)+'</span><span class="nm">'+m.name+'</span><kbd>'+(i+1)+'</kbd><svg class="ck" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
  b.onclick=()=>{setMode(i);closeMdd();};mddModes.appendChild(b);});
PALETTES.forEach((p,i)=>{const b=document.createElement('button');b.title=p.name;b.style.background='linear-gradient(120deg,'+p.c[0]+','+p.c[1]+','+p.c[2]+')';
  b.onclick=()=>setPalette(i);mddSw.appendChild(b);});
function openMdd(){mdd.classList.add('open');const on=mddModes.querySelector('.on');on&&on.focus({preventScroll:true});}
function closeMdd(){mdd.classList.remove('open');}
$('mddBtn').onclick=e=>{e.stopPropagation();mdd.classList.contains('open')?closeMdd():openMdd();};
document.addEventListener('pointerdown',e=>{if(!mdd.contains(e.target))closeMdd();},true);
window.addEventListener('blur',closeMdd);
$('themeBtn').onclick=()=>toggleTheme();
[...$('mddTheme').children].forEach(x=>x.onclick=()=>setTheme(x.dataset.t));
const palEl=$('palettes');
PALETTES.forEach((p,i)=>{const s=document.createElement('div');s.className='sw';s.title=p.name;
  s.style.background='conic-gradient('+p.c[0]+','+p.c[1]+','+p.c[2]+','+p.c[0]+')';s.onclick=()=>setPalette(i);palEl.appendChild(s);});

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1100);}
function setMode(i,quiet){i=((i%MODES.length)+MODES.length)%MODES.length;mode=i;
  [...modesEl.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  [...mddModes.children].forEach((b,j)=>b.classList.toggle('on',j===i));$('mddIco').innerHTML=svgI(MODES[i].id);$('mddName').textContent=MODES[i].name;if(!quiet)toast(MODES[i].name);resetMode();postState();}
let theme=(()=>{const q=params.get('theme');if(q==='black'||q==='light')return q;try{return localStorage.getItem('fmpTheme')||'light';}catch(e){return 'light';}})();
function setTheme(t,quiet){theme=t==='black'?'black':'light';document.body.classList.toggle('dark',theme==='black');
  const b=$('themeBtn');if(b)b.title=(theme==='black'?'Light theme':'Black theme')+' (T)';
  [...$('mddTheme').children].forEach(x=>x.classList.toggle('on',x.dataset.t===theme));
  try{localStorage.setItem('fmpTheme',theme);}catch(e){}
  if(!quiet)toast(theme==='black'?'Black theme':'Light theme');postState();return theme;}
function toggleTheme(){return setTheme(theme==='black'?'light':'black');}
function setPalette(i,quiet){pal=((i%PALETTES.length)+PALETTES.length)%PALETTES.length;const p=PALETTES[pal],r=document.documentElement.style;
  r.setProperty('--a1',p.c[0]);r.setProperty('--a2',p.c[1]);r.setProperty('--a3',p.c[2]);r.setProperty('--a4',p.c[3]);
  r.setProperty('--bg1',p.bg1);r.setProperty('--bg2',p.bg2);
  [...palEl.children].forEach((b,j)=>b.classList.toggle('on',j===pal));[...mddSw.children].forEach((b,j)=>b.classList.toggle('on',j===pal));if(!quiet)toast(p.name+' palette');postState();}

/* ---------- Audio ---------- */
function ensureCtx(){
  if(actx)return;
  const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();DBG.ctx++;
  analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.8;
  gain=actx.createGain();gain.gain.value=$('vol').value/100;
  analyser.connect(gain);gain.connect(actx.destination);
  freq=new Uint8Array(analyser.frequencyBinCount);time=new Uint8Array(analyser.fftSize);freqF=new Float32Array(analyser.frequencyBinCount);
}
function attachElement(){ensureCtx();if(!srcNode){srcNode=actx.createMediaElementSource(audio);srcNode.connect(analyser);}}

function addFiles(list){
  const files=[...list].filter(f=>(f.type&&f.type.startsWith('audio/'))||/\.(mp3|wav|m4a|ogg|oga|flac|aac|webm|opus)$/i.test(f.name));
  if(!files.length){toast('No audio files found');return;}
  const start=tracks.length;
  files.forEach(f=>tracks.push({name:f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' '),url:URL.createObjectURL(f),ext:(f.name.split('.').pop()||'').toUpperCase()}));
  renderPlaylist();
  if(cur<0||demo){stopDemo();load(start,true);}
}
function renderPlaylist(){syncLoop();
  document.body.classList.toggle('has-tracks',tracks.length>0);
  const l=$('plList');l.innerHTML='';
  tracks.forEach((t,i)=>{const d=document.createElement('div');d.className='trk'+(i===cur?' on':'');
    d.innerHTML='<span class="n">'+(i===cur&&!audio.paused?'♪':(i+1))+'</span><span class="t"></span><button class="rm" type="button" title="Remove from playlist" aria-label="Remove">×</button>';
    d.querySelector('.t').textContent=t.name;
    d.onclick=()=>load(i,true);
    d.querySelector('.rm').onclick=e=>{e.stopPropagation();removeTrack(i);};
    l.appendChild(d);});
  requestAnimationFrame(resize);
}
function resetEmptyPlayer(){
  cur=-1;audio.pause();audio.removeAttribute('src');try{audio.load();}catch(e){}
  $('title').textContent='Nothing playing';$('subt').textContent='Load a track to begin';
  $('drop').classList.remove('hidden');
  $('seek').value=0;$('seek').style.setProperty('--p','0%');$('cur').textContent='0:00';$('dur').textContent='0:00';
  setPlayingUI(false);
}
function removeTrack(i){
  if(i<0||i>=tracks.length)return;
  const t=tracks[i],removingCurrent=i===cur,keepPlaying=removingCurrent&&isPlaying();
  if(t.url&&String(t.url).startsWith('blob:'))try{URL.revokeObjectURL(t.url);}catch(e){}
  tracks.splice(i,1);
  if(!tracks.length){resetEmptyPlayer();renderPlaylist();postState();toast('Removed '+t.name);return;}
  if(i<cur)cur--;
  else if(removingCurrent){if(cur>=tracks.length)cur=tracks.length-1;load(cur,keepPlaying);renderPlaylist();toast('Removed '+t.name);return;}
  if(cur>=0&&tracks[cur]){const u=tracks[cur];$('subt').textContent='Track '+(cur+1)+' of '+tracks.length+(u.ext?' · '+u.ext:'');}
  renderPlaylist();postState();toast('Removed '+t.name);
}
let loadToken=0;
function load(i,autoplay){
  if(!tracks.length)return;stopDemo();
  cur=((i%tracks.length)+tracks.length)%tracks.length;const t=tracks[cur],token=++loadToken;DBG.loads++;
  $('title').textContent=t.name;const sub='Track '+(cur+1)+' of '+tracks.length+(t.ext?' · '+t.ext:'');$('subt').textContent=sub;
  $('drop').classList.add('hidden');renderPlaylist();
  const go=()=>{if(token!==loadToken)return;$('subt').textContent=sub;
    if(t.cors)audio.crossOrigin='anonymous';else audio.removeAttribute('crossorigin');
    lastT=0;if(audio.src!==t.url)audio.src=t.url;else audio.currentTime=0;syncLoop();if(autoplay)play();postState();};
  if(t.remote&&!t.resolved){
    // Native fmp:// URL: stream it straight into <audio> (same origin, served with HTTP Range by the app).
    // Only if streaming fails or stalls do we fall back to pulling the whole file into a blob.
    t.url=t.src;t.resolved=true;t.streamed=true;go();armStreamFallback(t,token,autoplay);
  }else go();
}
let streamTimer=0;
function armStreamFallback(t,token,autoplay){
  clearTimeout(streamTimer);
  const done=()=>{clearTimeout(streamTimer);audio.removeEventListener('loadedmetadata',ok);audio.removeEventListener('error',bad);};
  const ok=()=>done();
  const bad=()=>{done();if(token!==loadToken||t.blobTried)return;t.blobTried=true;
    $('subt').textContent='Loading…';
    fetch(t.src).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob();})
      .then(b=>{if(t.url&&t.url.startsWith('blob:'))URL.revokeObjectURL(t.url);t.url=URL.createObjectURL(b);if(token===loadToken)load(cur,autoplay);})
      .catch(()=>{if(token===loadToken){$('subt').textContent='Could not load file';toast('Could not load '+t.name);}});};
  audio.addEventListener('loadedmetadata',ok);audio.addEventListener('error',bad);
  streamTimer=setTimeout(()=>{if(audio.readyState<1)bad();},6000);
}
/* Add files by URL (used by the macOS app for Finder double-click / Open With / Dock drops).
   list: [{name,url}] ; opts.play: start playing the first newly-added file. Returns index of first file. */
function addFileURLs(list,opts){
  opts=opts||{};if(!Array.isArray(list))list=[list];
  let first=-1;
  list.forEach(f=>{if(!f||!f.url)return;
    const raw=f.name||decodeURIComponent(String(f.url).split(/[?#]/)[0].split('/').pop()||'Track');
    let idx=tracks.findIndex(t=>t.src===f.url);
    if(idx<0){tracks.push({name:raw.replace(/\.[^.]+$/,'').replace(/[_]+/g,' '),src:f.url,url:f.url,remote:true,resolved:false,ext:(raw.includes('.')?raw.split('.').pop():'').toUpperCase()});idx=tracks.length-1;}
    if(first<0)first=idx;});
  renderPlaylist();
  if(first>=0&&(opts.play!==false||cur<0||demo))load(first,opts.play!==false);
  else postState();
  return first;
}
function play(){
  if(demo){demoPlaying=true;resumeCtx();setPlayingUI(true);return;}
  if(cur<0){if(tracks.length)load(0,false);else{$('file').click();return;}}
  attachElement();resumeCtx();audio.play().catch(e=>toast('Playback blocked — press play'));
}
function pause(){if(demo){demoPlaying=false;actx.suspend();setPlayingUI(false);return;}audio.pause();}
function isPlaying(){return demo?demoPlaying:!audio.paused;}
function togglePlay(){isPlaying()?pause():play();}
function next(){if(tracks.length)load(cur+1,true);}
function prev(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return;}load(cur-1,true);}
function seekBy(s){if(demo||!isFinite(audio.duration))return;audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+s));}
function setPlayingUI(p){
  document.body.classList.toggle('playing',p);
  $('playIco').innerHTML=p?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  renderPlaylistMarks();postState();
}
function renderPlaylistMarks(){[...$('plList').children].forEach((d,i)=>{d.classList.toggle('on',i===cur);d.querySelector('.n').textContent=(i===cur&&isPlaying())?'♪':(i+1);});}
audio.addEventListener('play',()=>setPlayingUI(true));
audio.addEventListener('pause',()=>setPlayingUI(false));
/* Repeat-track (and repeat-all with one track, and "once") use audio.loop on the SAME element:
   no 'ended' -> pause -> seek -> play gap (where WebKit may tear down/rebuild its AudioQueue and
   a hidden page can be suspended), no new src/nodes. Wrap-around is detected from timeupdate. */
function syncLoop(){const l=repeat==='one'||repeat==='once'||(repeat==='all'&&tracks.length===1);if(audio.loop!==l)audio.loop=l;}
let lastT=0;
audio.addEventListener('timeupdate',()=>{const t=audio.currentTime,d=audio.duration;
  if(audio.loop&&isFinite(d)&&lastT>d-1.5&&t<1.5&&lastT-t>1){DBG.loops++;
    if(repeat==='once'){setRepeat('off',true);toast('Played once more');}}
  lastT=t;});
audio.addEventListener('ended',()=>{DBG.ended++;
  if(repeat==='one'){audio.currentTime=0;play();return;}
  if(repeat==='once'){audio.currentTime=0;setRepeat('off',true);toast('Playing once more');play();return;}
  if(cur<tracks.length-1)next();else if(repeat==='all')load(0,true);else setPlayingUI(false);});
audio.addEventListener('error',()=>{if(audio.src)toast('Could not decode this file');});
const fmt=s=>{if(!isFinite(s))return '0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let scrubbing=false;
function updateTime(){
  if(demo){$('cur').textContent=fmt(actx.currentTime);$('dur').textContent='∞';return;}
  const d=audio.duration,c=audio.currentTime;$('cur').textContent=fmt(c);$('dur').textContent=fmt(d);
  if(!scrubbing&&isFinite(d)&&d>0){const v=c/d*1000;$('seek').value=v;$('seek').style.setProperty('--p',(v/10)+'%');}
}
$('seek').addEventListener('input',e=>{scrubbing=true;e.target.style.setProperty('--p',(e.target.value/10)+'%');if(isFinite(audio.duration))$('cur').textContent=fmt(e.target.value/1000*audio.duration);});
$('seek').addEventListener('change',e=>{if(isFinite(audio.duration))audio.currentTime=e.target.value/1000*audio.duration;scrubbing=false;});
const volEl=$('vol');let lastVol=.8;
function applyVol(){const v=volEl.value/100;volEl.style.setProperty('--p',volEl.value+'%');audio.volume=1;if(gain)gain.gain.value=v;else audio.volume=v;}

/* keyboard */
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(mdd.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeMdd();$('mddBtn').focus();return;}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const it=[...mddModes.children],k=it.indexOf(document.activeElement);it[(k+(e.key==='ArrowDown'?1:it.length-1))%it.length].focus();return;}
    if(e.key==='Enter'||e.code==='Space')return;}
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();seekBy(e.shiftKey?30:5);}
  else if(e.key==='ArrowLeft'){e.preventDefault();seekBy(e.shiftKey?-30:-5);}
  else if(e.key==='ArrowUp'){e.preventDefault();volEl.value=Math.min(100,+volEl.value+5);applyVol();}
  else if(e.key==='ArrowDown'){e.preventDefault();volEl.value=Math.max(0,+volEl.value-5);applyVol();}
  else if(/^[1-6]$/.test(e.key))setMode(+e.key-1);
  else if(e.key==='p'||e.key==='P')setPalette(pal+1);
  else if(e.key==='t'||e.key==='T')toggleTheme();
  else if(e.key==='n'||e.key==='N')next();
  else if(e.key==='b'||e.key==='B')prev();
  else if(e.key==='r'||e.key==='R')cycleRepeat();
  else if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFullscreen();}
  else if(e.key==='Escape'&&fs){e.preventDefault();toggleFullscreen();}
});

/* demo oscillator signal */
function startDemo(){
  ensureCtx();stopDemo();demo=true;if(!audio.paused)audio.pause();
  const out=actx.createGain();out.gain.value=.5;out.connect(analyser);
  const nodes=[out];
  [110,220,277.18,329.63,440,659.25,880].forEach((f,i)=>{const o=actx.createOscillator();o.type=i===0?'sawtooth':(i%2?'triangle':'sine');o.frequency.value=f;
    const g=actx.createGain();g.gain.value=i===0?.25:.12/(1+i*.3);
    const l=actx.createOscillator();l.frequency.value=.2+i*.13;const lg=actx.createGain();lg.gain.value=f*.01;l.connect(lg);lg.connect(o.frequency);l.start();
    o.connect(g);g.connect(out);o.start();nodes.push(o,g,l,lg);});
  // kick drum pulse via LFO on a low sine
  const k=actx.createOscillator();k.frequency.value=55;const kg=actx.createGain();kg.gain.value=0;k.connect(kg);kg.connect(out);k.start();
  const lfo=actx.createOscillator();lfo.type='square';lfo.frequency.value=2;const lfg=actx.createGain();lfg.gain.value=.5;lfo.connect(lfg);lfg.connect(kg.gain);lfo.start();
  nodes.push(k,kg,lfo,lfg);
  // noise hats
  const buf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(((i/actx.sampleRate*8)%1)<.08?1:0);
  const ns=actx.createBufferSource();ns.buffer=buf;ns.loop=true;const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const ng=actx.createGain();ng.gain.value=.25;
  ns.connect(hp);hp.connect(ng);ng.connect(out);ns.start();nodes.push(ns,hp,ng);
  demoNodes=nodes;demoPlaying=true;resumeCtx();
  $('title').textContent='Demo Tone';$('subt').textContent='Generated oscillator signal';$('drop').classList.add('hidden');setPlayingUI(true);
}
function stopDemo(){if(!demoNodes)return;demoNodes.forEach(n=>{try{n.stop&&n.stop();}catch(_){}try{n.disconnect();}catch(_){}});demoNodes=null;demo=false;demoPlaying=false;resumeCtx();}

let lastSent='',postTimer=0,lastPost=0;
// Coalesce state posts: at most one native message per 120ms, always sending the latest state.

  if(postTimer)return;const wait=Math.max(0,120-(performance.now()-lastPost));
  postTimer=setTimeout(()=>{postTimer=0;lastPost=performance.now();
    try{const h=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native;if(!h)return;
      const s=getState(),j=JSON.stringify(s);if(j===lastSent)return;lastSent=j;h.postMessage(Object.assign({type:'state'},s));}catch(_){}},wait);
}

let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);const r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
  const cw=Math.round(W*DPR),ch=Math.round(H*DPR);if(cv.width!==cw||cv.height!==ch){cv.width=cw;cv.height=ch;}ctx.setTransform(DPR,0,0,DPR,0,0);metrics();}

const lerp=(a,b,t)=>a+(b-a)*t;
function hex(c){const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function rgba(c,a){const h=hex(c);return 'rgba('+h[0]+','+h[1]+','+h[2]+','+a+')';}
function mix(c1,c2,t){const a=hex(c1),b=hex(c2);return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}
function palAt(t){const c=PALETTES[pal].c;t=Math.max(0,Math.min(.9999,t))*(c.length-1);const i=Math.floor(t);return mix(c[i],c[Math.min(c.length-1,i+1)],t-i);}

// idle fake data so it never looks dead
let tt=0;
function idleData(){
  for(let i=0;i<freq.length;i++){const x=i/freq.length;freq[i]=Math.max(0,(Math.sin(i*.05+tt*1.3)*.5+.5)*40*(1-x)+12*Math.sin(tt*.7+i*.013)+10);}
  for(let i=0;i<time.length;i++)time[i]=128+Math.sin(i*.012+tt*2)*10+Math.sin(i*.031-tt)*5;
}
// log-spaced bands
function bands(n,maxBin){maxBin=maxBin||Math.floor(freq.length*.72);const out=new Array(n);
  for(let b=0;b<n;b++){const lo=Math.floor(Math.pow(maxBin,b/n)),hi=Math.max(lo+1,Math.floor(Math.pow(maxBin,(b+1)/n)));let s=0,m=0;
    for(let i=lo;i<hi&&i<freq.length;i++){s+=freq[i];m=Math.max(m,freq[i]);}out[b]=(s/(hi-lo)*.6+m*.4)/255*(1+b/n*.35);}return out;}
let bass=0,bassAvg=0,mid=0,treb=0,energy=0,beat=0,lastBeat=0;
function analyse(now){
  let b=0,m=0,t=0;for(let i=1;i<10;i++)b+=freq[i];for(let i=10;i<100;i++)m+=freq[i];for(let i=100;i<400;i++)t+=freq[i];
  b/=9*255;m/=90*255;t/=300*255;bass=lerp(bass,b,.5);mid=lerp(mid,m,.3);treb=lerp(treb,t,.3);energy=(bass+mid+treb)/3;
  bassAvg=lerp(bassAvg,b,.04);beat*=.9;
  if(b>bassAvg*1.18&&b>.3&&now-lastBeat>220){beat=1;lastBeat=now;onBeat();}
}

/* state per mode */
/* Everything below scales from the canvas CSS size (W,H), so the same modes look right in the
   420px menu-bar panel and in a 1500px window. U = unit scale (1 at a ~420px short side). */
let U=1,SMALL=false;
function metrics(){const S=Math.min(W,H);U=Math.max(.55,Math.min(1.7,S/420));SMALL=W<600;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let peaks=[],parts=[],gridPeaks=[];
function resetMode(){peaks=[];gridPeaks=[];waveHist=[];if(MODES[mode].id==='particles')initParts();}
function partCount(){return Math.round(clamp(W*H/(SMALL?2400:4200),36,260));}
function initParts(){metrics();parts=[];const n=partCount();for(let i=0;i<n;i++)parts.push(newPart(true));}
function newPart(init){const a=Math.random()*Math.PI*2;return {x:Math.random()*W,y:Math.random()*H,vx:Math.cos(a)*.3,vy:Math.sin(a)*.3,r:(1.6+Math.random()*(SMALL?4.2:6))*U,
  c:Math.random(),life:init?Math.random():1,band:Math.floor(Math.random()*32),ph:Math.random()*6.28};}
function onBeat(){if(MODES[mode].id==='particles'){const cx=W/2,cy=H/2,k=1.1*U;parts.forEach(p=>{const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*k;p.vy+=dy/d*k;});}}
function palGrad(x0,x1){const g=ctx.createLinearGradient(x0,0,x1,0);PALETTES[pal].c.forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c));return g;}

function drawBars(){
  // fewer, wider bars on narrow canvases: target pitch ~16px small / ~14px large
  const pad=Math.max(12,W*.035),inner=W-pad*2,n=Math.round(clamp(inner/(SMALL?17:14),14,96)),bs=bands(n);
  const pitch=inner/n,gap=clamp(pitch*.3,2,8),bw=pitch-gap,cy=H*(SMALL?.6:.55),maxH=H*(SMALL?.5:.44),rad=Math.min(bw/2,6*U);
  if(peaks.length!==n)peaks=new Array(n).fill(0);
  const g=palGrad(pad,W-pad);
  ctx.fillStyle=theme==='black'?'rgba(255,255,255,.08)':'rgba(43,40,64,.06)';ctx.fillRect(pad,cy-.5,inner,1);
  const capH=clamp(3*U,2,4);
  for(let i=0;i<n;i++){const v=Math.pow(bs[i],1.25),h=Math.max(2*U,v*maxH),x=pad+i*pitch+gap/2;
    peaks[i]=Math.max(peaks[i]-maxH*.012,h);
    ctx.fillStyle=g;ctx.globalAlpha=.95;roundRect(x,cy-h,bw,h,rad);ctx.fill();
    ctx.globalAlpha=.3;roundRect(x,cy+3*U,bw,h*.6,rad);ctx.fill();
    ctx.globalAlpha=.9;ctx.fillStyle=palAt(i/n);roundRect(x,cy-peaks[i]-capH-4*U,bw,capH,capH/2);ctx.fill();}
  ctx.globalAlpha=1;
  const rh=H-cy;const f=ctx.createLinearGradient(0,cy,0,cy+rh*.85);f.addColorStop(0,'rgba(0,0,0,0)');f.addColorStop(1,'rgba(0,0,0,.95)');
  ctx.fillStyle=f;ctx.globalCompositeOperation='destination-out';ctx.fillRect(0,cy+2,W,rh);ctx.globalCompositeOperation='source-over';
}
function roundRect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect){ctx.roundRect(x,y,w,h,Math.max(0,r));return;}r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

let waveHist=[];
function drawWave(){
  const N=Math.round(clamp(W/3,96,256)),step=Math.max(1,Math.floor(time.length/2/N)),pts=[];
  let off=0;for(let i=1;i<time.length/2;i++){if(time[i-1]<128&&time[i]>=128){off=i;break;}}
  if(off+N*step>time.length)off=0;
  for(let i=0;i<N;i++){let s=0;for(let k=0;k<step&&off+i*step+k<time.length;k++)s+=time[off+i*step+k];pts.push((s/step-128)/128);}
  const hist=SMALL?4:6;waveHist.unshift(pts);if(waveHist.length>hist)waveHist.length=hist;
  const pad=Math.max(12,W*.04),cy=H/2,amp=H*(SMALL?.32:.36),x0=pad,xw=W-pad*2,lw=clamp(2.6*U,1.6,3.6),echo=5*U;
  const g=palGrad(x0,x0+xw);
  const yAt=(p,i,h)=>cy+clamp(p[i]*amp*(1+bass*.5),-amp*1.25,amp*1.25)*Math.sin(Math.PI*i/(p.length-1))+h*echo;
  for(let h=waveHist.length-1;h>=0;h--){const p=waveHist[h],a=h===0?1:.14*(1-h/(hist+1));
    ctx.beginPath();let ly=0;for(let i=0;i<p.length;i++){const x=x0+i/(p.length-1)*xw,y=yAt(p,i,h);
      if(i===0)ctx.moveTo(x,y);else{const px=x0+(i-1)/(p.length-1)*xw;ctx.quadraticCurveTo(px,ly,(px+x)/2,(ly+y)/2);}ly=y;}
    ctx.strokeStyle=g;ctx.globalAlpha=a;ctx.lineWidth=h===0?lw:lw*.6;ctx.lineJoin=ctx.lineCap='round';
    if(h===0){ctx.shadowColor=rgba(PALETTES[pal].c[1],.5);ctx.shadowBlur=14*U;}ctx.stroke();ctx.shadowBlur=0;}
  ctx.globalAlpha=1;
  const p=waveHist[0];ctx.beginPath();ctx.moveTo(x0,cy);
  for(let i=0;i<p.length;i++)ctx.lineTo(x0+i/(p.length-1)*xw,yAt(p,i,0));
  ctx.lineTo(x0+xw,cy);ctx.closePath();const fg=ctx.createLinearGradient(0,cy-amp,0,cy+amp);fg.addColorStop(0,rgba(PALETTES[pal].c[0],.14));fg.addColorStop(1,rgba(PALETTES[pal].c[2],.14));ctx.fillStyle=fg;ctx.fill();
}

let rot=0;
function drawRadial(){
  const S=Math.min(W,H),cx=W/2,cy=H/2,base=S*.19,R=base*(1+bass*.3+beat*.06),maxL=S*.19;
  // spoke count follows the circumference so spokes keep ~6-7px pitch at any size
  const n=2*Math.round(clamp(Math.PI*2*base/(SMALL?7.5:6)/2,24,70)),half=n/2,bs=bands(half);
  rot+=.002+energy*.01;
  const halo=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,Math.min(R*2.6,S*.62));halo.addColorStop(0,rgba(PALETTES[pal].c[1],.28+beat*.15));halo.addColorStop(.5,rgba(PALETTES[pal].c[2],.10));halo.addColorStop(1,rgba(PALETTES[pal].c[2],0));
  ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
  for(let k=3;k>=1;k--){const rr=Math.min(R*(1+k*.45)+bass*k*10*U,S*.49);ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.strokeStyle=rgba(PALETTES[pal].c[k%4],.12);ctx.lineWidth=clamp(1.3*U,1,2);ctx.stroke();}
  ctx.lineCap='round';const lw=clamp((Math.PI*2*R/n)*.55,1.5,7*U),r0=R+3*U;
  for(let i=0;i<n;i++){const bi=i<half?i:n-1-i,v=Math.pow(bs[bi],1.3),a=rot+i/n*Math.PI*2,l=Math.min(4*U+v*maxL,S*.5-r0-2);
    const ca=Math.cos(a),sa=Math.sin(a),x1=cx+ca*r0,y1=cy+sa*r0,x2=cx+ca*(r0+l),y2=cy+sa*(r0+l);
    const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,palAt(bi/half));g.addColorStop(1,rgba(PALETTES[pal].c[(bi>>3)%4],.35));
    ctx.strokeStyle=g;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  const core=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);PALETTES[pal].c.forEach((c,i,a)=>core.addColorStop(i/(a.length-1),c));
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=core;ctx.shadowColor=rgba(PALETTES[pal].c[1],.45);ctx.shadowBlur=30*U;ctx.fill();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(cx,cy,R*.62,0,Math.PI*2);ctx.fillStyle=theme==='black'?'rgba(0,0,0,.92)':'rgba(255,255,255,.9)';ctx.fill();
  ctx.beginPath();const m=SMALL?96:128;for(let i=0;i<=m;i++){const a=i/m*Math.PI*2,sv=(time[Math.floor(i/m*(time.length-1))]-128)/128,r=R*.42+clamp(sv,-1,1)*R*.18;
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.closePath();ctx.strokeStyle=core;ctx.lineWidth=clamp(2.2*U,1.4,3);ctx.stroke();
}

function drawParticles(){
  const want=partCount();
  if(!parts.length||Math.abs(parts.length-want)>want*.25)initParts();
  const bs=bands(32),cx=W/2,cy=H/2,S=Math.min(W,H),link=clamp(70*U,40,110),pull=.00012*(420/Math.max(200,S));
  const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,S*(.38+bass*.22));gl.addColorStop(0,rgba(PALETTES[pal].c[0],.22+beat*.2));gl.addColorStop(1,rgba(PALETTES[pal].c[0],0));ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.lineWidth=clamp(U,.7,1.3);
  for(let i=0;i<parts.length;i+=2){const p=parts[i];for(let j=i+2;j<parts.length;j+=7){const q=parts[j],dx=p.x-q.x,dy=p.y-q.y;if(dx>link||dx<-link||dy>link||dy<-link)continue;const d=Math.hypot(dx,dy);
    if(d<link){ctx.strokeStyle=rgba(PALETTES[pal].c[2],(1-d/link)*.18*(.4+energy));ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}}
  const sp=(1+bass*3)*clamp(U,.7,1.4),m=20*U;
  for(const p of parts){const v=bs[p.band]||0;p.ph+=.02;
    const dx=p.x-cx,dy=p.y-cy;p.vx+=-dy*.00004*(1+energy*4)+Math.cos(p.ph)*.02;p.vy+=dx*.00004*(1+energy*4)+Math.sin(p.ph)*.02;
    p.vx+=-dx*pull;p.vy+=-dy*pull;p.vx*=.965;p.vy*=.965;p.x+=p.vx*sp;p.y+=p.vy*sp;
    if(p.x<-m)p.x=W+m;if(p.x>W+m)p.x=-m;if(p.y<-m)p.y=H+m;if(p.y>H+m)p.y=-m;
    const r=p.r*(.6+v*1.5+beat*.35),rr=r*2.1;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rr);
    g.addColorStop(0,palAt(p.c));g.addColorStop(.45,rgba(PALETTES[pal].c[Math.floor(p.c*3.99)],.35));g.addColorStop(1,rgba(PALETTES[pal].c[Math.floor(p.c*3.99)],0));
    ctx.globalAlpha=.55+v*.45;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

let ribT=0;
function drawRibbons(){
  ribT+=.006+energy*.03;const L=H<340?4:5,bs=bands(L*4),seg=Math.round(clamp(W/6,40,120));
  const top=H*.16,span=H*.68,step=span/(L-0.4);
  for(let l=0;l<L;l++){const amp=H*(.035+Math.pow((bs[l*4]+bs[l*4+1])/2,1.4)*.085),base=top+l*step,f=(SMALL?.9:1.2)+l*(SMALL?.4:.55),sp=ribT*(1+l*.3),c1=PALETTES[pal].c[l%4],c2=PALETTES[pal].c[(l+1)%4],th=H*(.03+.025*Math.sin(sp*.5+l));
    ctx.beginPath();
    for(let i=0;i<=seg;i++){const x=i/seg*W,u=i/seg;const y=base+Math.sin(u*Math.PI*f+sp)*amp+Math.sin(u*Math.PI*f*2.3-sp*1.4)*amp*.35*(.5+treb)+Math.cos(u*7+sp*.7)*amp*.15;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    for(let i=seg;i>=0;i--){const x=i/seg*W,u=i/seg;const y=base+th+H*.02*Math.sin(u*3+sp)+Math.sin(u*Math.PI*f+sp+.45)*amp*1.05+Math.sin(u*Math.PI*f*1.7-sp)*amp*.3;ctx.lineTo(x,y);}
    ctx.closePath();const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,rgba(c1,.55));g.addColorStop(.5,rgba(c2,.4));g.addColorStop(1,rgba(c1,.55));
    ctx.fillStyle=g;ctx.globalCompositeOperation='multiply';ctx.fill();ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=rgba(c1,.6);ctx.lineWidth=clamp(1.2*U,.8,1.8);ctx.stroke();}
}

function drawGrid(){
  // cell size targets ~22px (small) / ~26px (large); fewer columns on narrow canvases
  const pad=Math.max(14,Math.min(W,H)*.06),cell=SMALL?22:26;
  const cols=Math.round(clamp((W-pad*2)/cell,10,48)),rows=Math.round(clamp((H-pad*2)/cell,7,24)),bs=bands(cols);
  if(gridPeaks.length!==cols)gridPeaks=new Array(cols).fill(0);
  const cw=(W-pad*2)/cols,ch=(H-pad*2)/rows,r=Math.min(cw,ch)*.36,ox=pad+cw/2,oy=pad+ch/2;
  for(let c=0;c<cols;c++){const lvl=Math.min(rows,Math.round(Math.pow(Math.min(1,bs[c]),1.6)*rows*.95));gridPeaks[c]=Math.max(gridPeaks[c]-.15,lvl);
    for(let k=0;k<rows;k++){const x=ox+c*cw,y=oy+(rows-1-k)*ch,on=k<lvl,pk=k===Math.round(gridPeaks[c])-1&&!on;
      if(on){const t=k/rows;ctx.fillStyle=palAt(t*.85+c/cols*.15);ctx.globalAlpha=.55+t*.45;ctx.beginPath();ctx.arc(x,y,r*(1+(k===lvl-1?beat*.22:0)),0,Math.PI*2);ctx.fill();}
      else if(pk){ctx.globalAlpha=.9;ctx.fillStyle=PALETTES[pal].c[3];ctx.beginPath();ctx.arc(x,y,r*.9,0,Math.PI*2);ctx.fill();}
      else{ctx.globalAlpha=1;ctx.fillStyle=theme==='black'?'rgba(255,255,255,.07)':'rgba(43,40,64,.055)';ctx.beginPath();ctx.arc(x,y,r*.7,0,Math.PI*2);ctx.fill();}}}
  ctx.globalAlpha=1;
}

const DRAW={bars:drawBars,wave:drawWave,radial:drawRadial,particles:drawParticles,ribbons:drawRibbons,grid:drawGrid};
if(!freq){freq=new Uint8Array(1024);time=new Uint8Array(2048);}
let lastTimeUI=0,rafId=0,idleTimer=0,rafAt=0,lastDraw=0;
// Draw only while the surface is on screen. When hidden (popover closed / window hidden / minimized),
// stop requestAnimationFrame entirely and just tick the clock UI slowly.
// If a requested frame never arrived (WebKit suspends rAF while the view is detached/hidden), the
// stale rafId would make kick() a no-op forever: cancel and re-request.
function kick(force){if(rafId&&(force||performance.now()-rafAt>1500)){cancelAnimationFrame(rafId);rafId=0;}
  if(!rafId){clearTimeout(idleTimer);idleTimer=0;rafAt=performance.now();rafId=requestAnimationFrame(frame);}}
// Native asks for a full refresh after (re)attaching the view to a surface.
function refresh(){resize();setLayout(layout);kick(true);return [Math.round(innerWidth),Math.round(innerHeight),layout,visible,document.visibilityState].join(' ');}
// Cheap heartbeat so native can detect a visible-but-not-drawing page (self-heal).
// Always sent (not gated on visibility): native decides whether the page *should* be drawing.
let hbN=0;
setInterval(()=>{const h=nativeH();if(!h)return;
  if(visible&&performance.now()-lastDraw>1500)kick();
  const m={type:'hb',age:Math.round(performance.now()-lastDraw),vis:visible,doc:document.visibilityState,w:innerWidth,h:innerHeight,layout,
    t:(cur>=0&&!demo)?audio.currentTime:0,playing:isPlaying()};
  if(++hbN%30===1)m.stats=debugStats();
  try{h.postMessage(m);}catch(e){}},1000);
function debugStats(){const mem=performance.memory;
  return {rafPending:DBG.raf.size,intervals:DBG.iv.size,timeouts:DBG.to.size,listeners:DBG.lis,audioNodes:DBG.nodes,audioContexts:DBG.ctx,
    mediaSources:DBG.mes,mediaElements:document.querySelectorAll('audio,video').length,loops:DBG.loops,ended:DBG.ended,loads:DBG.loads,frames:DBG.frames,
    tracks:tracks.length,loop:audio.loop,t:+audio.currentTime.toFixed(2),paused:audio.paused,visible,doc:document.visibilityState,
    heap:mem?Math.round(mem.usedJSHeapSize/1048576*10)/10:null};}
function frame(now){
  rafId=0;DBG.frames++;
  if(!visible){updateTime();idleTimer=setTimeout(()=>{idleTimer=0;if(visible)kick();else frame(performance.now());},1000);return;}
  tt=now/1000;lastDraw=performance.now();
  const active=actx&&analyser&&isPlaying();
  if(active){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(time);}else idleData();
  analyse(now);
  ctx.clearRect(0,0,W,H);
  DRAW[MODES[mode].id]();
  const empty=cur<0&&!demo;if(empty!==frame._e){frame._e=empty;cv.style.opacity=empty?.3:1;}
  if(now-lastTimeUI>200){updateTime();lastTimeUI=now;}
  rafAt=performance.now();rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){visible=true;resize();kick(true);}});
window.addEventListener('focus',()=>{visible=true;kick();});
/* init */
resize();setMode(mode,true);setPalette(pal,true);setTheme(theme,true);setRepeat(repeat,true);if(params.has('fs'))setFullscreen(true);if(params.get('layout')==='compact')setLayout('compact');if(params.has('plopen'))togglePlaylist(true);
kick();
if(params.has('demo'))startDemo();
postState();
try{const nh=nativeH();if(nh)nh.postMessage({type:'ready'});}catch(_){}
})();
</script>
